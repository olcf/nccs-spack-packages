[project]
name = "nccs-spack-packages"
version = "1.0.0.dev0"
description = "NCCS's custom Spack package recipes."
requires-python = ">=3.6"

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff"
]

[tool.ruff]
target-version = "py37"
builtins = [
    "Executable"
]
include = [
    "repos/spack_repo/**/*.py"
]
line-length = 99

[tool.ruff.lint]
extend-select = ["E", "I", "W"]
ignore = [
    "FA100"
]

[tool.mypy]
files = [
    "repos/spack_repo/**/*.py"
]
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = [
    "name-defined"
]
check_untyped_defs = true
